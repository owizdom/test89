<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>MotoLift — USSD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e0e0e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    .phone {
      width: 330px;
      max-width: 100%;
      background: #191919;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── SIM / Phone identity ──────────────────── */
    .sim-bar {
      background: #141414;
      padding: 14px 18px 10px;
      border-bottom: 1px solid #222;
    }
    .sim-bar label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 5px;
    }
    .sim-bar input {
      width: 100%;
      background: #000;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 9px 12px;
      font-family: "Courier New", monospace;
      font-size: 15px;
      color: #ccc;
      outline: none;
    }
    .sim-bar input:focus { border-color: #33ff33; color: #fff; }
    .sim-bar .hint {
      font-size: 10px;
      color: #333;
      margin-top: 4px;
    }

    /* ── Screen ─────────────────────────────────── */
    .screen {
      background: #000;
      flex: 1;
      min-height: 240px;
      max-height: 340px;
      overflow-y: auto;
      padding: 14px 16px;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      line-height: 1.65;
      color: #33ff33;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .screen::-webkit-scrollbar { width: 0; }
    .screen .end-msg { color: #ffcc00; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #2a2a2a; }
    .screen .user-input { color: #555; font-size: 12px; }
    .screen .dots { color: #333; }

    .idle-msg {
      color: #2a2a2a;
      text-align: center;
      padding: 50px 16px;
      font-family: -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.8;
    }
    .idle-msg .code {
      font-size: 26px;
      color: #33ff33;
      font-family: "Courier New", monospace;
      font-weight: 700;
      margin-bottom: 10px;
    }

    /* ── Bottom bar ────────────────────────────── */
    .bar {
      background: #141414;
      border-top: 1px solid #222;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .bar input {
      flex: 1;
      min-width: 0;
      background: #000;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
      color: #fff;
      outline: none;
      font-family: "Courier New", monospace;
    }
    .bar input:focus { border-color: #33ff33; }
    .bar input::placeholder { color: #222; }

    .bar .btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    .bar .btn:active { transform: scale(0.9); }
    .bar .btn:disabled { opacity: 0.15; cursor: default; transform: none; }

    .btn-call { background: #22c55e; color: #000; }
    .btn-end { background: #dc2626; color: #fff; font-size: 11px; font-weight: 600; }

    @media (max-width: 370px) {
      .phone { width: 100%; border-radius: 0; }
      body { padding: 0; }
    }
  </style>
</head>
<body>

<div class="phone">
  <div class="sim-bar">
    <label>Your phone number</label>
    <input id="phoneNum" value="+250789" autocomplete="off" />
    <div class="hint">This is your SIM identity for the USSD session</div>
  </div>

  <div class="screen" id="screen">
    <div class="idle-msg">
      <div class="code">*384#</div>
      Type *384# below and press call
    </div>
  </div>

  <div class="bar">
    <input id="input" placeholder="*384#" autocomplete="off" />
    <button class="btn btn-end" id="btnEnd" onclick="hangup()" disabled>End</button>
    <button class="btn btn-call" id="btnGo" onclick="go()">&#9742;</button>
  </div>
</div>

<script>
const screen = document.getElementById("screen");
const input = document.getElementById("input");
const phoneInput = document.getElementById("phoneNum");
const btnGo = document.getElementById("btnGo");
const btnEnd = document.getElementById("btnEnd");

let mode = "idle"; // idle | active | ended
let sid = "";
let accum = "";

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });

async function go() {
  const v = input.value.trim();
  if (!v) return;

  if (mode === "idle") {
    if (v === "*384#" || v === "*384") {
      const phone = phoneInput.value.trim();
      if (phone.length < 10) {
        screen.innerHTML = '<div class="end-msg">Set your phone number above first</div>';
        return;
      }
      mode = "active";
      sid = "w" + Date.now();
      accum = "";
      screen.innerHTML = "";
      input.value = "";
      input.placeholder = "Enter option...";
      phoneInput.disabled = true;
      btnEnd.disabled = false;
      await send();
    } else {
      screen.innerHTML = '<div class="end-msg">Invalid code. Dial *384#</div>';
    }
    return;
  }

  if (mode === "active") {
    screen.innerHTML += '<div class="user-input">&gt; ' + esc(v) + '</div>\n';
    accum = accum ? accum + "*" + v : v;
    input.value = "";
    await send();
    return;
  }

  if (mode === "ended") reset();
}

async function send() {
  screen.innerHTML += '<div class="dots">...</div>';
  screen.scrollTop = screen.scrollHeight;
  btnGo.disabled = true;

  try {
    const r = await fetch("/ussd", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ sessionId: sid, phoneNumber: phoneInput.value.trim(), text: accum }),
    });
    const body = await r.text();
    const isCon = body.startsWith("CON");
    const msg = body.replace(/^(CON|END)\s?/, "");

    // remove dots
    const d = screen.querySelector(".dots:last-child");
    if (d) d.remove();

    if (isCon) {
      screen.innerHTML += esc(msg) + '\n\n';
      btnGo.disabled = false;
      input.focus();
    } else {
      screen.innerHTML += '<div class="end-msg">' + esc(msg) + '</div>';
      mode = "ended";
      btnGo.innerHTML = "&#8635;";
      btnGo.disabled = false;
      btnEnd.disabled = true;
      input.placeholder = "Press refresh to restart";
    }
    screen.scrollTop = screen.scrollHeight;
  } catch {
    const d = screen.querySelector(".dots:last-child");
    if (d) d.remove();
    screen.innerHTML += '<div class="end-msg">Connection error</div>';
    mode = "ended";
    btnGo.innerHTML = "&#8635;";
    btnGo.disabled = false;
    btnEnd.disabled = true;
  }
}

function hangup() {
  mode = "ended";
  screen.innerHTML += '\n<div class="end-msg">Session ended</div>';
  btnGo.innerHTML = "&#8635;";
  btnGo.disabled = false;
  btnEnd.disabled = true;
  input.placeholder = "Press refresh to restart";
}

function reset() {
  mode = "idle";
  sid = ""; accum = "";
  input.value = "";
  input.placeholder = "*384#";
  phoneInput.disabled = false;
  btnGo.innerHTML = "&#9742;";
  btnGo.disabled = false;
  btnEnd.disabled = true;
  screen.innerHTML = '<div class="idle-msg"><div class="code">*384#</div>Type *384# below and press call</div>';
}
</script>
</body>
</html>
